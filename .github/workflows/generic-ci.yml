
name: Laboratorio 08 - Pipeline generico

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar_python:
    uses: ./.github/workflows/reusable-ci.yml
    with:
      language: python
      project_path: "."
      python_version: "3.12"
      run_tests: true
      run_lint: true
  validar_node:
    uses: ./.github/workflows/reusable-ci.yml
    with:
      language: node
      project_path: "examples/node"
      node_version: "22"
      run_tests: true
      run_lint: true
