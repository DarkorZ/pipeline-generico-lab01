
name: CI reutilizable

on:
  workflow_call:
    inputs:
      language:
        required: true
        type: string

      project_path:
        required: false
        type: string
        default: "."

      python_version:
        required: false
        type: string
        default: "3.12"

      node_version:
        required: false
        type: string
        default: "22"

      run_tests:
        required: false
        type: boolean
        default: true

      run_lint:
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  validar_config:
    runs-on: ubuntu-latest
    steps:
      - name: Validar lenguaje soportado
        env:
          LANGUAGE: ${{ inputs.language }}
        run: |
          case "$LANGUAGE" in
            python|node)
              echo "Lenguaje soportado: $LANGUAGE"
              ;;
            *)
              echo "Lenguaje no soportado: $LANGUAGE"
              exit 1
              ;;
          esac

  pruebas_genericas:
    needs: validar_config
    if: inputs.run_tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        if: inputs.language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}

      - name: Configurar Node.js
        if: inputs.language == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      - name: Instalar dependencias Python
        if: inputs.language == 'python'
        working-directory: ${{ inputs.project_path }}
        run: python -m pip install -r requirements-ci.txt

      - name: Instalar dependencias Node.js
        if: inputs.language == 'node'
        working-directory: ${{ inputs.project_path }}
        run: npm ci

      - name: Ejecutar pruebas Python
        if: inputs.language == 'python'
        working-directory: ${{ inputs.project_path }}
        run: python -m pytest -v

      - name: Ejecutar pruebas Node.js
        if: inputs.language == 'node'
        working-directory: ${{ inputs.project_path }}
        run: npm test

  calidad_generica:
    needs: validar_config
    if: inputs.run_lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        if: inputs.language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}

      - name: Configurar Node.js
        if: inputs.language == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      - name: Instalar dependencias Python
        if: inputs.language == 'python'
        working-directory: ${{ inputs.project_path }}
        run: python -m pip install -r requirements-ci.txt

      - name: Instalar dependencias Node.js
        if: inputs.language == 'node'
        working-directory: ${{ inputs.project_path }}
        run: npm ci

      - name: Analizar calidad Python
        if: inputs.language == 'python'
        working-directory: ${{ inputs.project_path }}
        run: python -m ruff check .

      - name: Analizar calidad Node.js
        if: inputs.language == 'node'
        working-directory: ${{ inputs.project_path }}
        run: npm run lint
