
name: Mi primer pipeline CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar pytest
        run: python -m pip install pytest

      - name: Ejecutar pruebas unitarias
        run: python -m pytest -v
  calidad:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4
  
      - name: Instalar Ruff
        run: python -m pip install ruff==0.17.3
  
      - name: Analizar calidad de codigo
        run: ruff check --output-format=github .



  build:
    needs: [pruebas, calidad]
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar herramienta de build
        run: python -m pip install build

      - name: Construir paquete
        run: python -m build

      - name: Guardar artefactos
        uses: actions/upload-artifact@v4
        with:
          name: paquete-python
          path: dist/
          if-no-files-found: error
          retention-days: 7


  verificar_paquete:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Descargar artefacto
        uses: actions/download-artifact@v4
        with:
          name: paquete-python
          path: dist/

      - name: Instalar paquete
        run: python -m pip install dist/*.whl

      - name: Comprobar instalacion
        run: |
          cd "$RUNNER_TEMP"
          python -c "from app import sumar; assert sumar(2, 3) == 5; print('Paquete instalado correctamente')"

