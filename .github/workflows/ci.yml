
name: Mi primer pipeline CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar pytest
        run: python -m pip install -r requirements-ci.txt

      - name: Ejecutar pruebas unitarias
        run: python -m pip install -r requirements-ci.txt
  calidad:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4
  
      - name: Instalar Ruff
        run: python -m pip install -r requirements-ci.txt
  
      - name: Analizar calidad de codigo
        run: ruff check --output-format=github .



  build:
    needs: [pruebas, calidad, seguridad]
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar herramienta de build
        run: python -m pip install -r requirements-ci.txt

      - name: Construir paquete
        run: python -m build

      - name: Guardar artefactos
        uses: actions/upload-artifact@v4
        with:
          name: paquete-python
          path: dist/
          if-no-files-found: error
          retention-days: 7


  verificar_paquete:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Descargar artefacto
        uses: actions/download-artifact@v4
        with:
          name: paquete-python
          path: dist/

      - name: Instalar paquete
        run: python -m pip install dist/*.whl

      - name: Comprobar instalacion
        run: |
          cd "$RUNNER_TEMP"
          python -c "from app import sumar; assert sumar(2, 3) == 5; print('Paquete instalado correctamente')"


  seguridad:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar pip-audit
        run: python -m pip install pip-audit==2.10.1

      - name: Auditar dependencias
        run: python -m pip_audit -r requirements-ci.txt

        
  despliegue_pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [pruebas, calidad, seguridad, build, verificar_paquete]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    concurrency:
      group: github-pages
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Descargar paquete verificado
        uses: actions/download-artifact@v4
        with:
          name: paquete-python
          path: dist/

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generar sitio estatico
        run: |
          python - <<'PY'
          from pathlib import Path
          from html import escape
          import hashlib
          import os
          import shutil

          output = Path("site")
          output.mkdir(exist_ok=True)

          wheel = next(Path("dist").glob("*.whl"))
          shutil.copy2(wheel, output / wheel.name)

          digest = hashlib.sha256(wheel.read_bytes()).hexdigest()
          commit = os.environ["GITHUB_SHA"][:7]

          html = f"""<!doctype html>
          <html lang="es">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Pipeline generico CI/CD</title>
          </head>
          <body>
            <h1>Pipeline generico - Entrega de prueba</h1>
            <p>Paquete construido y verificado por GitHub Actions.</p>
            <p>Commit: <code>{commit}</code></p>
            <p>Archivo: <code>{escape(wheel.name)}</code></p>
            <p>SHA256: <code>{digest}</code></p>
            <p><a href="{escape(wheel.name)}">Descargar paquete Python</a></p>
          </body>
          </html>"""

          (output / "index.html").write_text(html, encoding="utf-8")
          (output / "health.json").write_text(
              '{"status": "ok"}\n', encoding="utf-8"
          )
          PY

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar artefacto Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/

      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

        


          

